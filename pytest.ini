[pytest]
filterwarnings =
    ignore::DeprecationWarning:jupyter_client.*
    ignore::optuna.exceptions.ExperimentalWarning
    ignore::DeprecationWarning:comet_ml.*
    # Third-party: Starlette TestClient's httpx deprecation (fastapi.testclient).
    ignore:Using .httpx. with .starlette.*
    # Third-party: kds triggers the deprecated pandas groupby.apply behavior.
    ignore:DataFrameGroupBy.apply operated on the grouping columns:FutureWarning
