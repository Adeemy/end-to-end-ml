[project]
name = "end-to-end-ml"
version = "0.1.0"
description = """
An end-to-end ML project for tabular data that incorporates software engineering principles
in machine learning. It spans the whole lifecycle of a ML model, from data exploration,
preprocessing, feature engineering, model selection, training, evaluation, to deployment.
"""
readme = "README.md"
requires-python = ">=3.14"
# Lower-bound pins (not exact pins) so the project installs on Python 3.14, where
# the previous 2023-era exact pins have no wheels. uv.lock captures the exact
# resolved versions for reproducibility.
dependencies = [
  "comet_ml>=3.49",
  "dask>=2024.8",
  # Modern FastAPI (pydantic v2). The old `fastapi<0.100` pin forced pydantic v1,
  # which conflicts with mlflow>=3 and lacks Python 3.14 support.
  "fastapi>=0.115",
  "joblib>=1.4",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "kds>=0.1.3",
  "numpy>=2.1",
  "optuna>=4.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "polars>=1.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "seaborn>=0.13",
  "xgboost>=2.1",
  "mlflow>=3.5",
]

[project.optional-dependencies]
dev = [
  "black[jupyter]",
  "pytest",
  "pylint",
  "isort",
  "pytest-cov",
  "pytest-mock",
  "pre-commit",
  # httpx backs FastAPI's TestClient (used by the serving tests).
  "httpx"
]

# Feature-store tooling (feast). Kept optional because feast pins old transitive
# deps (pyarrow/grpcio-tools) that lag new Python releases; it is only needed by
# the feature pipeline (generate_initial_data.py / prep_data.py / split_data.py),
# not by training, inference, or the test suite.
feature-store = [
  "feast>=0.40",
]

# Distributed Optuna search (optional). The parallel search path imports it
# lazily; serial search (the default) does not require it.
distributed = [
  "optuna-distributed>=0.6.1",
]

analysis = [
  "phik>=0.12.4",
  "ipython>=8.17.2"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
# Pin the target to 3.14 so Black does not format for 3.15 (the running
# interpreter is 3.14, and its AST safety check cannot parse 3.15-targeted code).
target-version = ["py314"]

[tool.isort]
profile = "black"
