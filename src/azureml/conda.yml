# Conda environment for the Azure ML training/evaluation jobs.
# Python 3.11: the azure-ai-ml v2 SDK and azureml-featurestore target 3.11/3.12,
# not 3.14. Runtime dependencies are installed directly (not `pip install -e .`)
# because the project pins requires-python>=3.14; the job uploads src/ as `code`.
name: end-to-end-ml-train-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas>=2.2
      - numpy>=1.26
      - scikit-learn>=1.5
      - lightgbm>=4.5
      - xgboost>=2.1
      - optuna>=4.0
      - joblib>=1.4
      - pyyaml>=6.0
      - python-dotenv>=1.0
      - matplotlib>=3.9
      - kds>=1.1
      # Azure ML + tracking
      - mlflow>=2.16
      - azureml-mlflow>=1.57
      - azureml-featurestore>=1.0
      - azure-ai-ml>=1.20
      - azure-identity>=1.17
      - azure-keyvault-secrets>=4.8
